[project]
name = "exxeta-arm"
version = "0.1.0"
description = "PC software of the exxeta-arm robot arm: dora-rs nodes, kinematics, planner, safety, web server"
requires-python = ">=3.11"          # dora-rs 1.x needs Python 3.11 or newer
dependencies = [
    "dora-rs==1.1.0",               # node API (pinned; verified 2026-11-15)
    "pyarrow",                      # comes with dora-rs; listed because we import it
    "numpy>=2.0",
    "pyyaml>=6.0",
    "pyserial>=3.5",
    "aiohttp>=3.10",
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
cli = ["dora-rs-cli==1.1.0"]        # the `dora` command, if you prefer pip over the official installer

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["exxeta_arm"]
