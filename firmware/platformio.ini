; exxeta-arm firmware (PlatformIO). See docs/firmware/ and docs/decisions/ADR-0007.
;   pio run                 build for the ESP32
;   pio run -t upload       flash over USB
;   pio test -e native      host unit tests (needs a C++ compiler on the PC)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0      ; pinned: Arduino-ESP32 core 2.0.17
board = esp32dev                  ; classic ESP32-WROOM-32 DevKit (38 pin)
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -Wall -DCORE_DEBUG_LEVEL=1
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall
